<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/layout.css" />
  </head>

  <body>
    <header>
      <nav class="header-wrapper">
        <a class="logo" href="/">
          <img src="./image/logo.png" alt="로고" />
        </a>
        <a class="button btn-login" href="/login" target="_blank">로그인</a>
      </nav>
    </header>

    <section class="section-a section-top">
      <div class="section-wrapper">
        <div class="panel-left">
          <div class="title">일상의 모든 물건을<br />거래해 보세요</div>
          <a class="button btn-goto" href="/items" target="_blank"
            >구경하러 가기</a
          >
        </div>
        <div class="panel-right">
          <img src="./image/home_top.png" alt="상단 이미지" />
        </div>
      </div>
    </section>

    <section class="section-b section1">
      <div class="section-wrapper">
        <div class="panel-left">
          <div class="badge">Hot item</div>
          <div class="title">인기 상품을<br />확인해 보세요</div>
          <div class="description">
            가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요
          </div>
        </div>
        <div class="panel-right">
          <img src="./image/home_1.png" alt="설명 이미지 1" />
        </div>
      </div>
    </section>

    <section class="section-b section2">
      <div class="section-wrapper">
        <div class="panel-left">
          <div class="badge">Search</div>
          <div class="title">구매를 원하는<br />상품을 검색하세요</div>
          <div class="description">
            구매하고 싶은 물품은 검색해서 쉽게 찾아보세요
          </div>
        </div>
        <div class="panel-right">
          <img src="./image/home_2.png" alt="설명 이미지 2" />
        </div>
      </div>
    </section>

    <section class="section-b section3">
      <div class="section-wrapper">
        <div class="panel-left">
          <div class="badge">Register</div>
          <div class="title">판매를 원하는<br />상품을 등록하세요</div>
          <div class="description">
            어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요
          </div>
        </div>
        <div class="panel-right">
          <img src="./image/home_3.png" alt="설명 이미지 3" />
        </div>
      </div>
    </section>

    <section class="section-a section-bottom">
      <div class="section-wrapper">
        <div class="panel-left">
          <div class="title">믿을 수 있는<br />판다마켓 중고 거래</div>
        </div>
        <div class="panel-right">
          <img src="./image/home_bottom.png" alt="하단 이미지" />
        </div>
      </div>
    </section>

    <footer>
      <div class="footer-wrapper">
        <div class="copyright">&copy; codeit - 2024</div>
        <ul class="menu">
          <li><a href="/privacy" target="_blank">Privacy Policy</a></li>
          <li><a href="/faq" target="_blank">FAQ</a></li>
        </ul>
        <ul class="sns-icon">
          <li>
            <a href="https://www.facebook.com/" target="_blank">
              <img src="./image/icon_facebook.svg" alt="Facebook" />
            </a>
          </li>
          <li>
            <a href="https://x.com/" target="_blank">
              <img src="./image/icon_x.svg" alt="X" />
            </a>
          </li>
          <li>
            <a href="https://www.youtube.com/" target="_blank">
              <img src="./image/icon_youtube.svg" alt="YouTube" />
            </a>
          </li>
          <li>
            <a href="https://www.instagram.com/" target="_blank">
              <img src="./image/icon_instagram.svg" alt="Instagram" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
